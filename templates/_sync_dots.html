{#- Sync status dots: green/red/grey, time in the tooltip, click opens the log. -#}
{% macro pve_dot(cluster) -%}
<button type="button"
  class="sync-dot {% if cluster.last_pve_sync_ok is none %}sync-unknown{% elif cluster.last_pve_sync_ok %}sync-ok{% else %}sync-fail{% endif %}"
  title="PVE: {% if cluster.last_pve_sync_at %}{{ cluster.last_pve_sync_at|datetime_local }}{% else %}{{ t('cluster.never_synced') }}{% endif %}{% if cluster.last_pve_sync_ok is sameas false and cluster.last_pve_sync_success_at %} · {{ t('cluster.last_sync_success') }} {{ cluster.last_pve_sync_success_at|datetime_local }}{% endif %} – {{ t('cluster.show_sync_log') }}"
  data-log-title="{{ t('cluster.pve_sync_log_title', name=cluster.name) }}"
  data-log="{{ cluster.last_pve_sync_log or t('common.no_log') }}"
  aria-label="{{ t('cluster.show_sync_log') }}"></button>
{%- endmacro %}

{% macro pbs_dot(pbs) -%}
<button type="button"
  class="sync-dot {% if pbs.last_sync_ok is none %}sync-unknown{% elif pbs.last_sync_ok %}sync-ok{% else %}sync-fail{% endif %}"
  title="PBS {{ pbs.name }}: {% if pbs.last_sync_at %}{{ pbs.last_sync_at|datetime_local }}{% else %}{{ t('cluster.never_synced') }}{% endif %} – {{ t('cluster.show_pbs_sync_log') }}"
  data-log-title="{{ t('cluster.pbs_sync_log_title', name=pbs.name) }}"
  data-log="{{ pbs.last_sync_log or t('common.no_log') }}"
  aria-label="{{ t('cluster.show_pbs_sync_log') }}"></button>
{%- endmacro %}
