{#- Log viewer: opens over the page (static/js/sync.js); anything with
    data-log opens it. Esc, × or a click beside it closes it. -#}
<dialog class="log-dialog" id="sync-log-panel" aria-labelledby="sync-log-title">
  <div class="log-dialog-head">
    <h3 id="sync-log-title">{{ t('js.sync_log') }}</h3>
    <span id="sync-log-status" class="muted"></span>
    <button type="button" class="log-dialog-btn" id="sync-log-copy" title="{{ t('common.copy') }}" aria-label="{{ t('common.copy') }}">
      <svg class="icon-copy" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1"/></svg>
      <svg class="icon-copied" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="20 6 9 17 4 12"/></svg>
    </button>
    <button type="button" class="log-dialog-btn" id="sync-log-close" title="{{ t('common.close') }}" aria-label="{{ t('common.close') }}">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>
    </button>
  </div>
  <pre id="sync-log-content" class="sync-log-pre" tabindex="0" autofocus></pre>
</dialog>
