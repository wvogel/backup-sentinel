stages:
  - lint
  - test
  - deploy

lint:
  stage: lint
  image: python:3.12-slim
  before_script:
    - pip install --quiet ruff==0.14.0
  script:
    - ruff check app tests scripts
    - ruff format --check app tests scripts

test:
  stage: test
  image: python:3.12-slim
  services:
    - name: postgres:18
      alias: postgres
  variables:
    POSTGRES_DB: backup_reports
    POSTGRES_USER: backup_reports
    POSTGRES_PASSWORD: backup_reports
    BSENTINEL_DATABASE_URL: "postgresql://backup_reports:backup_reports@postgres:5432/backup_reports"
    BSENTINEL_SECRET_KEY: "dUwD46AT9M2L9EYpKahkU8mC7A5pvxjFTqX5hxBbdcQ="
    # Throwaway service DB: enables tests/test_db.py (they truncate tables).
    BSENTINEL_DB_TESTS: "1"
  before_script:
    # WeasyPrint (NIS2 PDF report) needs Pango/HarfBuzz.
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0 fonts-inter fonts-dejavu-core >/dev/null
    - pip install --quiet -r requirements.txt pytest httpx
  script:
    - pytest tests/ -v

deploy:
  stage: deploy
  image: alpine/curl
  only:
    - main
  script:
    - |
      env | grep '^DEPLOY_WEBHOOK' | while IFS='=' read -r name url; do
        echo "Triggering ${name}..."
        curl -f --show-error -X POST "$url"
        echo " -> OK"
      done
